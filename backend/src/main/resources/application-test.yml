spring:
  # Used only when Testcontainers is off (-Dapp.test.use-testcontainers=false); otherwise @ServiceConnection overrides it.
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/disaster_test}
    username: ${TEST_DB_USERNAME:disaster}
    password: ${TEST_DB_PASSWORD:disaster}
    hikari:
      # A shared Supabase session pooler allows ~15 connections for the whole team, and every cached
      # test context owns a pool: keep them small and let idle ones close.
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 10000

logging:
  level:
    lk.dmc.disaster: INFO

app:
  integrations:
    sms:
      provider: mock      # tests never send real SMS, whatever backend/.env says
  storage:
    provider: local     # tests never upload to Supabase, whatever backend/.env says
    root: ./target/test-uploads
  simulation:
    enabled: false
  auth:
    jwt-secret: test-only-secret-that-is-at-least-32-characters-long
    cookie-secure: false
    expose-dev-code: true
