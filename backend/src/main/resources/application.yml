spring:
  config:
    import: optional:file:.env[.properties]   # local secrets, see backend/.env.example
  application:
    name: disaster-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/disaster}
    username: ${DB_USERNAME:disaster}
    password: ${DB_PASSWORD:disaster}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}   # small: a shared Supabase pooler serves the whole team
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    out-of-order: true     # owners add migrations in parallel; versions are unique per owner
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true          # Modulith creates its event_publication table
      republish-outstanding-events-on-restart: true

server:
  port: 8080
  error:
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  storage:
    root: ./uploads
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    jwt-secret: ${JWT_SECRET:}            # required, at least 32 characters (see backend/.env.example)
    issuer: safelanka
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    otp-ttl: 5m
    otp-max-attempts: 3
    otp-resend-cooldown: 60s
    max-failed-logins: 5
    lock-duration: 15m
    cookie-secure: ${AUTH_COOKIE_SECURE:true}   # false only for plain-http local development
    expose-dev-code: false                      # true only in dev/test: returns the SMS code in the response
  paging:
    max-page-size: 100
  # External integrations are simulated in dev/test; real values go in backend/.env
  integrations:
    sms:
      provider: ${SMS_PROVIDER:mock}        # mock (default, no messages sent) | textlk (real SMS)
      sender-id: ${SMS_SENDER_ID:TextLKDemo}
      textlk:
        api-key: ${SMS_TEXTLK_API_KEY:}
    push:
      fcm-server-key: ${FCM_SERVER_KEY:}
    weather:
      api-key: ${WEATHER_API_KEY:}
    river-gauge:
      url: ${RIVER_GAUGE_FEED_URL:}
      api-key: ${RIVER_GAUGE_API_KEY:}
