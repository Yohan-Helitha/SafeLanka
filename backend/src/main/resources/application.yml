spring:
  config:
    import: optional:file:.env[.properties]   # local secrets, see backend/.env.example
  application:
    name: disaster-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/disaster}
    username: ${DB_USERNAME:disaster}
    password: ${DB_PASSWORD:disaster}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true          # Modulith creates its event_publication table
      republish-outstanding-events-on-restart: true

server:
  port: 8080
  error:
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  storage:
    root: ./uploads
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  paging:
    max-page-size: 100
  # External integrations are simulated in dev/test; real values go in backend/.env
  integrations:
    sms:
      url: ${SMS_GATEWAY_URL:}
      api-key: ${SMS_GATEWAY_API_KEY:}
      sender-id: ${SMS_SENDER_ID:}
    push:
      fcm-server-key: ${FCM_SERVER_KEY:}
    weather:
      api-key: ${WEATHER_API_KEY:}
    river-gauge:
      url: ${RIVER_GAUGE_FEED_URL:}
      api-key: ${RIVER_GAUGE_API_KEY:}
